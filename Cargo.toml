[package]
name = "user-service-switcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
# Signal pumps consume zbus streams via StreamExt (spec §12: pure Rust).
futures-util = "0.3"
# zbus 5.x: tokio async runtime (default features off — no async-io, no blocking API).
zbus = { version = "5", default-features = false, features = ["tokio"] }
# zbus_systemd: systemd1 proxies; its `zbus-async-tokio` feature forwards to `zbus/tokio`.
zbus_systemd = { version = "0.26200", features = ["systemd1", "zbus-async-tokio"] }
